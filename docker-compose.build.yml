services:
  web:
    build:
      context: .
      dockerfile: src/SynapseAdmin/Dockerfile
    ports:
      # NOTE: Bind to 127.0.0.1 so external clients cannot bypass your reverse proxy.
      # Authentication cookies enforce Secure-only (CookieSecurePolicy.Always).
      # Direct HTTP access works on http://localhost:8080, while remote/LAN access requires
      # a TLS-terminating reverse proxy forwarding X-Forwarded-Proto: https.
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Optional: Comma-separated list of trusted reverse proxy IPs or CIDRs (defaults to loopback + private networks).
      # - TRUSTED_PROXIES=172.18.0.2,10.0.0.0/8
      # Optional: Restrict login to these homeservers and permit internal/plain-HTTP targets.
      # Required for a homeserver reached over http:// or on a private address (e.g. a Synapse container).
      # - HOMESERVER_ALLOWLIST=http://synapse:8008,matrix.example.com
      # IMPORTANT: Change this to a secure, unique passphrase in production!
      # It is used for encrypting the persisted Data Protection keys on disk (/app/keys).
      - DP_PASSPHRASE=your-secure-passphrase-here
    volumes:
      - ./logs:/app/logs
      - ./keys:/app/keys
