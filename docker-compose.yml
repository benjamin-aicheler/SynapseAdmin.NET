services:
  synapseadmin:
    image: ghcr.io/benjamin-aicheler/synapseadmin.net:latest
    container_name: synapseadmin
    ports:
      # NOTE: Authentication cookies enforce Secure-only (CookieSecurePolicy.Always).
      # Direct HTTP access works on http://localhost:8080, but remote/LAN access requires
      # a TLS-terminating reverse proxy forwarding X-Forwarded-Proto: https.
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # IMPORTANT: Change this to a secure, unique passphrase in production!
      # It is used for encrypting session tokens on disk.
      - DP_PASSPHRASE=your-secure-passphrase-here
    volumes:
      - ./logs:/app/logs
      - ./keys:/app/keys
    restart: unless-stopped
