# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-options-reference
#
# Covered here:
#   - nuget          -> NuGet packages of the web application and the tests
#   - github-actions -> actions used by the workflows in .github/workflows
#   - docker         -> base images in src/SynapseAdmin/Dockerfile
#   - devcontainers  -> image and features in .devcontainer/devcontainer.json
#
# Not covered: the `LibMatrix` git submodule (Dependabot does not support
# submodules). Keep that one updated manually.
#
# Minor and patch updates are grouped into a single PR per ecosystem to keep
# the PR volume low. Major updates stay as individual PRs so each one can be
# reviewed on its own.
#
# The app stays on .NET 10. The Docker tags (`10.0`), CI (`setup-dotnet`
# `10.0.x`) and the devcontainer (`10.0`) pick up each 10.0.x patch
# automatically. Dependabot ignores new .NET major versions (the "Stay on
# .NET 10" rules below). It would still propose a .NET 10 minor version, but
# .NET doesn't ship those: after 10.0 comes 11.0. To move to a new .NET
# version, remove the "Stay on .NET 10" rules.

version: 2
updates:
  # --- NuGet packages -------------------------------------------------------
  - package-ecosystem: "nuget"
    directories:
      - "/src/SynapseAdmin"
      - "/tests/SynapseAdmin.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stay on .NET 10: these packages' major version follows .NET (10.x = .NET 10).
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions -------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- Docker base images ---------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/src/SynapseAdmin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stay on .NET 10: no dotnet/sdk or dotnet/aspnet 11.0 or later.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  # --- Devcontainer ---------------------------------------------------------
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devcontainer"
    commit-message:
      prefix: "chore(devcontainer)"
      include: "scope"
    groups:
      devcontainer-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
